name: Sync banner data

# Banner windows come from the UIGF org's CurrentBannerWatcher dataset,
# which follows HoYoverse's official event wish announcements and is
# updated within days of a phase being announced. This job refreshes the
# character name/element/weapon table, regenerates src/banners.json, and
# commits only when something changed. Vercel then redeploys on its own.
#
# Announcements precede a phase, so a daily run never races a changeover.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A new banner character must resolve to a name, element, weapon and
      # rarity before the banner list can be generated.
      - name: Refresh character data from Enka
        run: |
          curl -fsSL -o data/enka/avatars.json https://raw.githubusercontent.com/EnkaNetwork/API-docs/master/store/gi/avatars.json
          curl -fsSL -o data/enka/locs.json https://raw.githubusercontent.com/EnkaNetwork/API-docs/master/store/gi/locs.json
          node scripts/build-enka-data.mjs

      - name: Sync banners from the UIGF watcher
        run: node scripts/sync-banners.mjs

      - run: npm test

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- src/banners.json src/data/characters.json src/upcoming.json; then
            echo "Banner data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/banners.json src/data/characters.json src/upcoming.json
          git commit -m "Sync banner and character data"
          git push
